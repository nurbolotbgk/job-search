databaseChangeLog:
  - changeSet:
      id: 007
      author: Nurbolot Abilov
      changes:
        - createTable:
            tableName: contacts_info
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: contact_value
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type_id
                  type: int
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contact_info_type
                    references: contact_types(id)
              - column:
                  name: resume_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_contact_info_resume
                    references: resumes(id)
                    deleteCascade: true