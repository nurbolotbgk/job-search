databaseChangeLog:
  - changeSet:
      id: 017
      author: Nurbolot Abilov
      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: sender_id
                  type: long
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: sender_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_message_sender