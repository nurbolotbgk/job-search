databaseChangeLog:
  - changeSet:
      id: 015
      author: Nurbolot Abilov
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: responded_applicant_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_message_responded_applicant
                    references: responded_applicants(id)

              - column:
                  name: content
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false