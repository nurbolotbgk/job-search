databaseChangeLog:
  - changeSet:
      id: 002
      author: Nurbolot Abilov
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: parent_id
                  type: int
                  constraints:
                    foreignKeyName: fk_category_parent
                    references: categories(id)